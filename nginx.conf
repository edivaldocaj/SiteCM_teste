# /etc/nginx/sites-available/cavalcantemelo.adv.br
# Cavalcante & Melo - Nginx Reverse Proxy Configuration

upstream nextjs {
    server 127.0.0.1:3000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name cavalcantemelo.adv.br www.cavalcantemelo.adv.br;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name cavalcantemelo.adv.br www.cavalcantemelo.adv.br;

    # SSL (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cavalcantemelo.adv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cavalcantemelo.adv.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # Client
    client_max_body_size 10M;

    # Static files — served directly by Nginx (fast, cached)
    location /_next/static/ {
        alias /var/www/cavalcantemelo/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        alias /var/www/cavalcantemelo/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/cavalcantemelo/public/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        alias /var/www/cavalcantemelo/public/favicon.ico;
        expires 7d;
        access_log off;
    }

    location /robots.txt {
        alias /var/www/cavalcantemelo/public/robots.txt;
        expires 1d;
        access_log off;
    }

    location /sitemap.xml {
        alias /var/www/cavalcantemelo/public/sitemap.xml;
        expires 1d;
        access_log off;
    }

    # Proxy everything else to Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
